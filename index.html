
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JPM Mobile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 25px 20px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-top: 20px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin: 5px 0 30px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .black {
      background: #111;
      color: white;
    }

    .gray {
      background: #eee;
      color: #111;
    }

    .danger {
      background: #e53935;
      color: white;
    }

    .status {
      text-align: center;
      margin: 15px 0;
      min-height: 20px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar strong {
      font-size: 24px;
    }

    .logout {
      width: auto;
      padding: 9px 14px;
      margin: 0;
      font-size: 13px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
      background: #fff;
    }

    .author {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .post-content {
      color: #333;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .date {
      color: #999;
      font-size: 12px;
    }

    .section-title {
      font-size: 20px;
      margin: 25px 0 15px;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #666;
      font-size: 14px;
    }

    .switch button {
      width: auto;
      background: none;
      color: #111;
      padding: 5px;
      margin: 0;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- CADASTRO -->
    <section id="registerScreen">

      <div class="logo">JPM</div>

      <p class="subtitle">Conectando pessoas</p>

      <h1>Cria a tua conta</h1>

      <p class="description">
        Entra na JPM e começa a fazer parte da nossa comunidade.
      </p>

      <input
        type="text"
        id="registerName"
        placeholder="Nome completo"
      >

      <input
        type="tel"
        id="registerPhone"
        placeholder="Número de telefone"
      >

      <input
        type="password"
        id="registerPassword"
        placeholder="Palavra-passe"
      >

      <button class="black" onclick="registerUser()">
        Criar conta
      </button>

      <div class="status" id="registerStatus"></div>

      <div class="switch">
        Já tens uma conta?
        <button onclick="showLogin()">Entrar</button>
      </div>

    </section>


    <!-- LOGIN -->
    <section id="loginScreen" class="hidden">

      <div class="logo">JPM</div>

      <p class="subtitle">Bem-vindo de volta</p>

      <h1>Entrar na JPM</h1>

      <p class="description">
        Entra na tua conta para continuar.
      </p>

      <input
        type="tel"
        id="loginPhone"
        placeholder="Número de telefone"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Palavra-passe"
      >

      <button class="black" onclick="loginUser()">
        Entrar
      </button>

      <div class="status" id="loginStatus"></div>

      <div class="switch">
        Ainda não tens conta?
        <button onclick="showRegister()">Criar conta</button>
      </div>

    </section>


    <!-- FEED -->
    <section id="feedScreen" class="hidden">

      <div class="topbar">
        <strong>JPM</strong>

        <button
          class="danger logout"
          onclick="logout()">
          Sair
        </button>
      </div>

      <p id="welcome"></p>

      <h2 class="section-title">
        O que estás a pensar?
      </h2>

      <textarea
        id="postContent"
        rows="4"
        placeholder="Partilha alguma coisa com a comunidade..."
      ></textarea>

      <button class="black" onclick="createPost()">
        Publicar
      </button>

      <div class="status" id="postStatus"></div>

      <h2 class="section-title">
        Publicações
      </h2>

      <div id="postsContainer">
        A carregar publicações...
      </div>

    </section>

  </main>


  <script>

    const API_URL = "https://jpm-backend-1.onrender.com";

    let currentUser = null;


    // =========================
    // TROCAR PARA LOGIN
    // =========================

    function showLogin() {

      document
        .getElementById("registerScreen")
        .classList.add("hidden");

      document
        .getElementById("loginScreen")
        .classList.remove("hidden");
    }


    // =========================
    // TROCAR PARA CADASTRO
    // =========================

    function showRegister() {

      document
        .getElementById("loginScreen")
        .classList.add("hidden");

      document
        .getElementById("registerScreen")
        .classList.remove("hidden");
    }


    // =========================
    // CRIAR CONTA
    // =========================

    async function registerUser() {

      const name =
        document.getElementById("registerName")
        .value.trim();

      const phone =
        document.getElementById("registerPhone")
        .value.trim();

      const password =
        document.getElementById("registerPassword")
        .value;

      const status =
        document.getElementById("registerStatus");


      if (!name || !phone || !password) {

        status.textContent =
          "Preenche todos os campos.";

        return;
      }


      if (password.length < 6) {

        status.textContent =
          "A palavra-passe deve ter pelo menos 6 caracteres.";

        return;
      }


      status.textContent =
        "A criar a tua conta...";


      try {

        const response = await fetch(
          `${API_URL}/api/register`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              name,
              phone,
              password
            })
          }
        );


        const data =
          await response.json();


        if (data.success) {

          status.textContent =
            "Conta criada com sucesso! 🎉";

          document.getElementById(
            "registerName"
          ).value = "";

          document.getElementById(
            "registerPhone"
          ).value = "";

          document.getElementById(
            "registerPassword"
          ).value = "";

          setTimeout(() => {

            showLogin();

          }, 1000);

        } else {

          status.textContent =
            data.message ||
            "Não foi possível criar a conta.";
        }


      } catch (error) {

        console.error(error);

        status.textContent =
          "Não foi possível contactar o servidor.";
      }
    }


    // =========================
    // LOGIN
    // =========================

    async function loginUser() {

      const phone =
        document.getElementById("loginPhone")
        .value.trim();

      const password =
        document.getElementById("loginPassword")
        .value;

      const status =
        document.getElementById("loginStatus");


      if (!phone || !password) {

        status.textContent =
          "Preenche o telefone e a palavra-passe.";

        return;
      }


      status.textContent =
        "A entrar...";


      try {

        const response = await fetch(
          `${API_URL}/api/login`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              phone,
              password
            })
          }
        );


        const data =
          await response.json();


        if (data.success) {

          currentUser = data.user;

          localStorage.setItem(
            "jpmUser",
            JSON.stringify(data.user)
          );

          document
            .getElementById("loginScreen")
            .classList.add("hidden");

          document
            .getElementById("feedScreen")
            .classList.remove("hidden");


          document.getElementById(
            "welcome"
          ).textContent =
            `Olá, ${data.user.name}! 👋`;


          loadPosts();


        } else {

          status.textContent =
            data.message ||
            "Não foi possível entrar.";
        }


      } catch (error) {

        console.error(error);

        status.textContent =
          "Não foi possível contactar o servidor.";
      }
    }


    // =========================
    // CRIAR PUBLICAÇÃO
    // =========================

    async function createPost() {

      if (!currentUser) {

        return;
      }


      const content =
        document.getElementById("postContent")
        .value.trim();

      const status =
        document.getElementById("postStatus");


      if (!content) {

        status.textContent =
          "Escreve alguma coisa antes de publicar.";

        return;
      }


      status.textContent =
        "A publicar...";


      try {

        const response = await fetch(
          `${API_URL}/api/posts`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              userId: currentUser.id,
              content
            })
          }
        );


        const data =
          await response.json();


        if (data.success) {

          document.getElementById(
            "postContent"
          ).value = "";

          status.textContent =
            "Publicação criada! 🎉";

          loadPosts();

        } else {

          status.textContent =
            data.message ||
            "Erro ao publicar.";
        }


      } catch (error) {

        console.error(error);

        status.textContent =
          "Não foi possível publicar.";
      }
    }


    // =========================
    // CARREGAR PUBLICAÇÕES
    // =========================

    async function loadPosts() {

      const container =
        document.getElementById("postsContainer");


      try {

        const response = await fetch(
          `${API_URL}/api/posts`
        );


        const data =
          await response.json();


        if (!data.success ||
            data.posts.length === 0) {

          container.innerHTML =
            "<p>Nenhuma publicação ainda. Sê o primeiro! 🚀</p>";

          return;
        }


        container.innerHTML = "";


        data.posts.forEach(post => {

          const card =
            document.createElement("div");

          card.className = "card";


          const date =
            new Date(post.createdAt)
              .toLocaleString("pt-PT");


          card.innerHTML = `
            <div class="author">
              ${escapeHTML(post.author)}
            </div>

            <div class="post-content">
              ${escapeHTML(post.content)}
            </div>

            <div class="date">
              ${date}
            </div>
          `;


          container.appendChild(card);

        });


      } catch (error) {

        console.error(error);

        container.innerHTML =
          "<p>Não foi possível carregar as publicações.</p>";
      }
    }


    // =========================
    // PROTEÇÃO DO TEXTO
    // =========================

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    // =========================
    // SAIR
    // =========================

    function logout() {

      currentUser = null;

      localStorage.removeItem("jpmUser");

      document
        .getElementById("feedScreen")
        .classList.add("hidden");

      showLogin();
    }


    // =========================
    // RECUPERAR LOGIN
    // =========================

    window.onload = function() {

      const savedUser =
        localStorage.getItem("jpmUser");


      if (savedUser) {

        try {

          currentUser =
            JSON.parse(savedUser);


          document
            .getElementById("registerScreen")
            .classList.add("hidden");

          document
            .getElementById("loginScreen")
            .classList.add("hidden");

          document
            .getElementById("feedScreen")
            .classList.remove("hidden");


          document.getElementById(
            "welcome"
          ).textContent =
            `Olá, ${currentUser.name}! 👋`;


          loadPosts();


        } catch (error) {

          localStorage.removeItem("jpmUser");
        }
      }
    };

  </script>

</body>
</html>
